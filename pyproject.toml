

[project]
name = "realtime-data-platform"
version = "0.1.0"
description = "A containerized real-time event ingestion and processing platform"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "requests>=2.31,<3",
    "kafka-python>=2.0,<3",
]

[project.optional-dependencies]
spark = [
    "pyspark==3.5.1",
    "cassandra-driver>=3.29,<4",
]

dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/realtime_platform"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

